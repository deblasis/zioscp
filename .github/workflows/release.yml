name: Release binaries

# Build self-contained zioscp binaries for all supported targets and attach them
# to the GitHub Release for the pushed tag. Uses -Dbackend=libssh2 so every
# binary is self-contained (no ssh/libssh2/openssl dependency).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to create the release + upload assets

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS uses the ssh backend (drives the system ssh that macOS ships);
          # the self-contained libssh2 backend can't link on zig 0.16 + the
          # current macOS SDK (framework resolution returns empty), so mac ships
          # the ssh-backend binary for now. Linux + Windows are self-contained
          # libssh2 builds, cross-compiled from Linux.
          - { runner: macos-latest,  target: aarch64-macos,     archive: tar.gz, backend: "" }
          - { runner: macos-latest,  target: x86_64-macos,      archive: tar.gz, backend: "" }
          - { runner: ubuntu-latest, target: x86_64-linux-gnu,  archive: tar.gz, backend: "-Dbackend=libssh2" }
          - { runner: ubuntu-latest, target: aarch64-linux-gnu, archive: tar.gz, backend: "-Dbackend=libssh2" }
          - { runner: ubuntu-latest, target: x86_64-windows-gnu, archive: zip,   backend: "-Dbackend=libssh2" }
    steps:
      - uses: actions/checkout@v4

      - name: Install vendor build deps (libssh2+openssl from source)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq autoconf automake libtool perl make curl

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build ${{ matrix.backend }} -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Package
        # Binary (+ licenses) at the ARCHIVE ROOT (no versioned subdir), so the
        # installers (brew bin.install, scoop "bin", install.sh/ps1) are simple
        # and autoupdate works. The asset FILENAME keeps the version+target.
        run: |
          version="${GITHUB_REF_NAME:-nightly}"
          stage="$(mktemp -d)"
          if [ "${{ matrix.target }}" = "x86_64-windows-gnu" ]; then
            cp zig-out/bin/zioscp.exe "$stage/zioscp.exe"
          else
            cp zig-out/bin/zioscp "$stage/zioscp"
          fi
          cp LICENSE-MIT LICENSE-APACHE "$stage/"
          asset="zioscp-${version}-${{ matrix.target }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ( cd "$stage" && zip -r "$PWD/$asset" . )
          else
            tar -C "$stage" -czf "$asset" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zioscp-${{ matrix.target }}
          path: zioscp-*-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --target master || true
          gh release upload "$GITHUB_REF_NAME" assets/zioscp-* --clobber
          echo "--- released assets ---"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
