name: ci
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: install just
        run: curl -sSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin
      # CI runs exactly what `just ci` runs locally (fmt-check + build + tests +
      # the cross-compile matrix). The Docker SFTP integration suite is
      # `just integration`, kept out of `ci` so it stays fast + network-free.
      - name: ci
        run: just ci
